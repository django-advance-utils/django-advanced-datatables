[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-advanced-datatables"
version = "1.0.0"
description = "Django views with javascript filters using Datatables"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ian Jones" }]
maintainers = [{ name = "Thomas Turner" }]
requires-python = ">=3.6"
dependencies = [
    "ajax-advanced-helpers>=1.0.1",
    "django-advanced-menus>=1.0.0",
    "django-advanced-modals>=1.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
excel = ["openpyxl"]

[project.urls]
Homepage = "https://github.com/django-advance-utils/django-advanced-datatables"
Upstream = "https://github.com/jonesim/django-datatables"

[tool.setuptools.packages.find]
include = ["django_datatables", "django_datatables.*"]
