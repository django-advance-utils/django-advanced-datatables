{% extends 'datatables/filter_blocks/base_filter_block.html' %}

{% block content %}
    <select class="filter-content" style="width:100%" multiple="multiple">
    </select>
{% endblock %}

{% block javascript %}
    <script>
        function Select2Filter(column_no, html_id, options) {

            this.storage_key = 'select2_filter'
            django_datatables.FilterBase.call(this, column_no, html_id, options)

            this.load_state = function (state_data) {
                var context = $('#' + this.html_id)
                $("select", context).val(state_data).trigger('change')
            }

            this.save_data = function (data) {
                var selected_ids = []
                var selected = $("#" + this.html_id + " select").select2('data');
                for (var i = 0; i < selected.length; i++) {
                    selected_ids.push(selected[i].id)
                }
                return selected_ids
            }

            this.buildfilter = function () {
                var refresh = arguments.length > 0 && arguments[0] !== undefined ? arguments[0] : false;
                this.filter_data = [];
                var selected = $("#" + this.html_id + " select").select2('data');
                for (var i = 0; i < selected.length; i++) {
                    // By the option's value, which hands back the key as the cells hold it; its text is what the
                    // page's parser made of the key, entities decoded, and matched none of an escaped cell's rows.
                    this.filter_data.push(decodeURI(selected[i].id))
                }
                if (refresh){
                    this.pTable.table.api().draw();
                }
            }

            this.filter = function (data) {
                var col_data = data[this.column_no];
                if (this.filter_data.length === 0) return true;
                if (this.filter_data.indexOf(col_data) < 0) {
                    if (col_data === "" || data[this.column_no] === null) {
                        if (this.filter_data.indexOf("null") < 0) return false
                    } else return false;
                }
                return true;
            }

            this.html = function () {
                var optionhtml = '<option value="%6">%1</option>'
                var htmldata = '';
                var sorted_keys = this.filter_calcs.sort_keys()
                var k = sorted_keys.next()
                while (!k.done){
                    // As the pivot filter: the & escaped so the parser hands the value back as written, and both
                    // placeholders filled in one pass.
                    var key = encodeURI(k.value).replace(/&/g, '&amp;')
                    var value = k.value
                    htmldata += optionhtml.replace(/%([16])/g, function (placeholder, number) {
                        return number === '1' ? value : key
                    })
                    k = sorted_keys.next()
                }
                var context = $('#' + this.html_id)
                $('.filter-content', context).html(htmldata);
                this.restore_state()
                $("select", context).select2({
                    templateResult: this.this_fn_parameter('format_template')
                }).change(this.this_fn('buildfilter', true))
                this.buildfilter(false)
            }

            this.clear = function () {
                var context = $('#' + this.html_id)
                $("select", context).val('').trigger('change')
            }
            this.format_template = function (state) {
                if (state.loading) return;
                // The key the counts are held under, from the option's value; the text the reader sees, written
                // as text: it is what the parser decoded, so written into markup again a typed tag would run.
                var key = state.id === undefined ? state.text : decodeURI(state.id)
                var badge = $('<span class="float-right mx-1 small badge badge-pill"></span>')
                    .addClass(this.filter_calcs.badge_colour(key)[0])
                    .text(this.filter_calcs.badge_string(key))
                return $('<span></span>').text(state.text).append(badge)
            }
        }

        Select2Filter.prototype = Object.create(django_datatables.FilterBase.prototype);
        var options = {};
        var new_filter = new Select2Filter({{ column_no }}, '{{ html_id }}', options);
    </script>
{% endblock %}
